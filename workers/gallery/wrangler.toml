name = "daily-app-factory"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "daily-app-factory-db"
database_id = "feb9e026-feb7-41ca-b1ec-bfbc2c7f66d4"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "APPS"
bucket_name = "daily-app-factory-apps"

[[kv_namespaces]]
binding = "CACHE"
id = "d3fbe613c6144cdc9557cc275e25ca2a"

[[queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "daily-pipeline"

[[queues.consumers]]
queue = "daily-pipeline"
max_batch_size = 1
max_retries = 0

[triggers]
crons = ["0 17 * * *", "0 19 * * *"]

[vars]
# Turnstile テスト用サイトキー（常に通過）。本番公開前にダッシュボードで作成したキーへ差し替える
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
