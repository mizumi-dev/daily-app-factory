name = "daily-app-factory"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "daily-app-factory-db"
database_id = "feb9e026-feb7-41ca-b1ec-bfbc2c7f66d4"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "APPS"
bucket_name = "daily-app-factory-apps"

[[kv_namespaces]]
binding = "CACHE"
id = "d3fbe613c6144cdc9557cc275e25ca2a"

[[queues.producers]]
binding = "PIPELINE_QUEUE"
queue = "daily-pipeline"

[[queues.consumers]]
queue = "daily-pipeline"
max_batch_size = 1
max_retries = 0

[triggers]
crons = ["0 17 * * *", "0 19 * * *"]

[vars]
# Turnstile ウィジェット（invisible / daily-app-factory）のサイトキー
TURNSTILE_SITE_KEY = "0x4AAAAAAEYh5En7DxyNUzKo"
# ハウススタイル規約の本番既定（v2 = 緩め / v3 = 厳しめ）。v3 は明示指定時のみ使用
HOUSE_STYLE_VERSION = "v2"
